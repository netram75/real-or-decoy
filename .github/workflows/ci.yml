name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: small end to end run
        run: |
          python generate_data.py --n-train 1500 --n-test 500
          python prepare.py --holdout 300
          python baseline.py public baseline_submission.csv
          python solution.py public submission.csv
          python grade.py --submission submission.csv --by-split
